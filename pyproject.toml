[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coal-retrofit"
version = "0.1.0"
description = "Preprocessing and experiment scaffolding for coal power retrofit analysis."
requires-python = ">=3.11"
dependencies = [
  "geopandas",
  "gurobipy",
  "netCDF4",
  "networkx",
  "numpy",
  "openpyxl",
  "pandas",
  "pyproj",
  "rasterio",
  "scikit-learn",
  "scipy",
  "shapely",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# 固定为 ruff 0.15 的缺省规则集。0.16 起缺省规则扩大（I001、RUF100、UP 等），不写明时两个版本报的条目不同。
select = ["E4", "E7", "E9", "F"]
