[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coal-retrofit"
version = "0.1.0"
description = "Abatement technology choice and CO2 source-sink matching for China's coal power and energy-intensive industry under basin water constraints: input builders, scenario solves and result export."
requires-python = ">=3.11"
dependencies = [
  "geopandas>=1.0",  # builders 无条件调用 GeoSeries.union_all()
  "gurobipy",
  "matplotlib>=3.8",  # scripts/plot_fig2 运行时导入 matplotlib.typing
  "netCDF4",
  "networkx",
  "numpy",
  "openpyxl",
  "pandas",
  "pyproj",
  "rasterio",
  "requests",
  "scikit-learn>=1.2",  # AgglomerativeClustering(metric="precomputed")，1.2 起才有 metric 参数
  "scipy",
  "shapely",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# 固定为 ruff 0.15 的缺省规则集。0.16 起缺省规则换了一套：多了 I001、RUF100、UP 等，
# 也不再含 E402、E741、F403 等。不写明时两个版本报的条目不同。
select = ["E4", "E7", "E9", "F"]
